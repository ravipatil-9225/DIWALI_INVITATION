<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shubh Deepavali — Patil Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600;700&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f5e6a8;
    --gold-deep: #9a7b1c;
    --cream: #fff8ec;
    --c1: #5c0f1c;
    --c2: #2b0710;
    --accent: #d4af37;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100vh;
  }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: radial-gradient(circle at 50% 18%, #2d180f 0%, #140b06 65%, #080402 100%);
    color: #fff6dc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 36px);
    overflow-x: hidden;
  }

  /* Centered Card Stage */
  .card-container {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 24px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 214, 102, .38), transparent 55%),
      linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75),
                0 0 45px rgba(212, 175, 55, 0.2),
                inset 0 0 0 1px rgba(245, 230, 168, 0.45);
    color: #fff6dc;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(24px, 6cqi, 44px) clamp(20px, 7cqi, 42px);
    container-type: inline-size;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 35px 95px rgba(0, 0, 0, 0.85),
                0 0 60px rgba(212, 175, 55, 0.3),
                inset 0 0 0 1px rgba(245, 230, 168, 0.6);
  }

  /* Outer and inner borders */
  .card::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(245, 230, 168, 0.55);
    border-radius: 16px;
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 20px;
    border: 1px dashed rgba(245, 230, 168, 0.28);
    border-radius: 12px;
    pointer-events: none;
  }

  /* Rotating Mandala Watermark */
  .mandala {
    position: absolute;
    width: 140%;
    left: -20%;
    top: -20%;
    opacity: 0.13;
    pointer-events: none;
    animation: spin 120s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Card Elements */
  .om {
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: clamp(34px, 9cqi, 52px);
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255, 214, 102, 0.65);
    line-height: 1;
    margin-top: 4px;
    z-index: 2;
  }

  .card .eyebrow {
    font-family: 'Cinzel', serif;
    letter-spacing: 0.35em;
    font-size: clamp(9px, 2.7cqi, 12px);
    color: var(--accent);
    text-transform: uppercase;
    z-index: 2;
  }

  .title-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  .card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(32px, 10cqi, 58px);
    line-height: 1.05;
    margin: 6px 0 0;
    background: linear-gradient(180deg, #fff6d0, var(--accent) 60%, #b08a2e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
  }

  .card .family {
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 3.8cqi, 18px);
    letter-spacing: 0.32em;
    color: #fff6dc;
    margin-top: 4px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  .card .msg {
    font-style: italic;
    font-size: clamp(15px, 4.6cqi, 21px);
    line-height: 1.48;
    max-width: 92%;
    color: #f7ecd0;
    margin: 8px 0;
    white-space: pre-wrap;
    z-index: 2;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }

  .bottom-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }

  /* Flickering Diyas */
  .diyas {
    display: flex;
    gap: 7px;
    align-items: flex-end;
    justify-content: center;
    height: 44px;
    margin-top: 6px;
  }

  .diya {
    position: relative;
    width: 17px;
    height: 10px;
    background: linear-gradient(#b5651d, #6b3410);
    border-radius: 0 0 10px 10px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
  }

  .diya::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 8px;
    height: 15px;
    background: radial-gradient(ellipse at 50% 80%, #fff7c2 0%, #ffb53b 40%, rgba(255,120,0,0) 75%);
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    animation: flicker 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 7px rgba(255, 190, 80, 0.95));
  }

  .diya:nth-child(2)::before { animation-delay: 0.4s; }
  .diya:nth-child(3)::before { animation-delay: 0.9s; }
  .diya:nth-child(4)::before { animation-delay: 0.2s; }
  .diya:nth-child(5)::before { animation-delay: 1.2s; }

  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(0.92, 1.06); opacity: 0.82; }
  }

  .divider {
    width: 62%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .card .from {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 4.5cqi, 21px);
    color: var(--accent);
  }

  .card .from small {
    display: block;
    font-size: 0.72em;
    color: #e9dcb8;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Twinkling Star Sparkles */
  .sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #fff3b0;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    opacity: 0;
    animation: twinkle 3.2s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 0.95; transform: scale(1); }
  }

  @media print {
    body { background: none; padding: 0; }
    .card { box-shadow: none; max-width: none; width: 100%; height: 100vh; border-radius: 0; }
    @page { size: A5 portrait; margin: 0; }
  }
</style>
</head>
<body>

<main class="card-container">
  <article class="card" id="card">
    <!-- Spinning Festive Mandala Background -->
    <svg class="mandala" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#f5e6a8" stroke-width="0.8">
        <circle cx="100" cy="100" r="95"/>
        <circle cx="100" cy="100" r="80"/>
        <circle cx="100" cy="100" r="60"/>
        <circle cx="100" cy="100" r="40"/>
        <g id="petals"></g>
      </g>
    </svg>

    <div class="om">ॐ</div>
    <div class="eyebrow">✦ Festival of Lights ✦</div>

    <div class="title-block">
      <h3>Shubh Deepavali</h3>
      <div class="family">PATIL FAMILY</div>
    </div>

    <p class="msg">May the festival of lights fill your home with joy, prosperity, and endless blessings.</p>

    <div class="bottom-block">
      <div class="diyas" aria-hidden="true">
        <span class="diya"></span>
        <span class="diya"></span>
        <span class="diya"></span>
        <span class="diya"></span>
        <span class="diya"></span>
      </div>
      <div class="divider"></div>
      <div class="from">
        <span>From the Patil Family</span>
        <small>2026</small>
      </div>
    </div>
  </article>
</main>

<script>
  (function () {
    var card = document.getElementById('card');

    // Generate decorative petals for the mandala
    var petals = document.getElementById('petals');
    if (petals) {
      var NS = 'http://www.w3.org/2000/svg';
      for (var i = 0; i < 16; i++) {
        var p = document.createElementNS(NS, 'ellipse');
        p.setAttribute('cx', '100');
        p.setAttribute('cy', '40');
        p.setAttribute('rx', '10');
        p.setAttribute('ry', '26');
        p.setAttribute('transform', 'rotate(' + (i * 22.5) + ' 100 100)');
        petals.appendChild(p);
      }
    }

    // Sparkles scattered over the card
    var spots = [[12, 18], [84, 12], [18, 72], [88, 64], [50, 30], [30, 88], [70, 92]];
    spots.forEach(function (s, idx) {
      var sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.style.left = s[0] + '%';
      sp.style.top = s[1] + '%';
      sp.style.animationDelay = (idx * 0.45) + 's';
      card.appendChild(sp);
    });
  })();
</script>
</body>
</html>
